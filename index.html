<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>乘法勇士打怪兽</title><style>body{margin:0;min-height:100vh;text-align:center;font-family:-apple-system;background:linear-gradient(#ffe934 43%,#9eea39 43%);color:#14522b}.box{max-width:500px;margin:15px auto;background:#fffef2;border:4px solid #187b3b;border-radius:24px;padding:16px;box-shadow:0 6px #075d27}.hide{display:none}button{border:0;border-radius:14px;background:#ffd52a;color:#164b27;font-size:22px;font-weight:bold;padding:14px;box-shadow:0 4px #c89100}.levels,.keys{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.keys{grid-template-columns:repeat(3,1fr)}.levels button{font-size:15px;background:#7bdd3d;box-shadow:0 4px #398c21}#m{font-size:85px}.row{display:flex;justify-content:space-between;font-weight:bold;margin:8px}.bar{height:18px;background:#ddd;border:2px solid #187b3b;border-radius:10px;overflow:hidden}.hp{height:100%;width:100%;background:#ff7429}.q{font-size:34px;font-weight:bold;margin:14px}.msg{height:28px;font-weight:bold}</style><main><h1>⚔️ 乘法勇士打怪兽</h1><section class=box id=s><p><b>答对攻击，答错或 5 秒超时怪兽反击！</b></p><div class=levels><button onclick="p('初级')">🌱初级<br>普通乘法</button><button onclick="p('中级')">⭐中级<br>乘法＋除法</button><button onclick="p('高级')">🔥高级<br>倒推挑战</button><button onclick="p('大师')">👑大师<br>随机混合</button></div><p id=choose>请选择难度</p><button onclick=go()>开始游戏</button></section><section class="box hide" id=g><div class=row><span id=life>❤️❤️❤️</span><span>🪙<i id=coin>0</i></span><span>第<i id=round>1</i>/5关</span></div><div id=m>👾</div><b id=name>小怪兽</b><div class=bar><div class=hp id=hp></div></div><div class=row><span>怪兽生命</span><span>⏱️<i id=sec>5</i>秒</span></div><div class=q id=q></div><div class=msg id=msg></div><div class=keys id=keys></div></section><section class="box hide" id=e><h2 id=title></h2><p id=sum></p><button onclick="location.reload()">再玩一次</button></section></main><script>let L='',a,b,A,V='',T,S=5,H=3,C=0,P=5,R=1,Z=0,$=x=>document.getElementById(x),M=['👾','👹','🧟','🐲','🐉'];function p(x){L=x;choose.textContent='已选择'+x+'，可以开始啦！'}function go(){if(!L)return choose.textContent='先选一个难度呀！';s.classList.add('hide');g.classList.remove('hide');n()}function n(){Z=0;V='';S=5;clearInterval(T);sec.textContent=S;life.textContent='❤️'.repeat(H);coin.textContent=C;round.textContent=R;m.textContent=M[R-1];name.textContent=R==5?'终极魔龙 BOSS':'第'+R+'关怪兽';hp.style.width=P*20+'%';a=1+Math.floor(Math.random()*9);b=1+Math.floor(Math.random()*9);let k=L=='初级'?0:L=='中级'?Math.floor(Math.random()*2):L=='高级'?1+Math.floor(Math.random()*2):Math.floor(Math.random()*3);if(k==0){A=a*b;q.textContent=a+' × '+b+' = ?'}else if(k==1){A=a;q.textContent=a*b+' ÷ '+b+' = ?'}else{A=a;q.textContent='? × '+b+' = '+a*b}msg.textContent='点击数字作答';keys.innerHTML=[1,2,3,4,5,6,7,8,9,'清除',0,'确定'].map(x=>'<button onclick="k(&quot;'+x+'&quot;)">'+x+'</button>').join('');T=setInterval(()=>{sec.textContent=--S;if(!S)bad('时间到！怪兽反击！')},1000)}function k(x){if(Z)return;if(x=='清除')V='';else if(x=='确定'){if(V&&+V==A)ok();else if(V)bad('答错了！正确答案是 '+A);return}else if(V.length<2)V+=x;msg.textContent='你的答案：'+(V||'—')}function ok(){Z=1;clearInterval(T);C+=10;P--;msg.textContent='⚔️答对了！攻击成功！';setTimeout(()=>{if(!P){if(R==5)return end(1);R++;P=5}n()},650)}function bad(x){if(Z)return;Z=1;clearInterval(T);H--;msg.textContent='💥'+x;setTimeout(()=>H?n():end(0),800)}function end(w){g.classList.add('hide');e.classList.remove('hide');title.textContent=w?'🏆通关啦，乘法勇士！':'😿挑战失败，再来一次！';sum.textContent='你获得了 '+C+' 枚金币。'}</script>
